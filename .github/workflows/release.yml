name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published LocalSky version to package
        required: true
        type: string
      changelog:
        description: Product-news line for the app changelog
        required: false
        type: string
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.base.outputs.revision }}
      image: ${{ steps.base.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve published source and immutable base image
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          python3 .github/scripts/test_release.py
          python3 .github/scripts/release.py validate
  build:
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build native candidate by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./localsky
          platforms: linux/${{ matrix.arch }}
          build-args: BASE_IMAGE=${{ needs.validate.outputs.image }}
          outputs: type=image,name=ghcr.io/silenthooligan/localsky-haos,push-by-digest=true,name-canonical=true,push=true
      - name: Native startup, health, assets and shutdown
        env:
          BASE_IMAGE: ${{ needs.validate.outputs.image }}
          SMOKE_IMAGE: ghcr.io/silenthooligan/localsky-haos@${{ steps.build.outputs.digest }}
          VERSION: ${{ inputs.version }}
          REVISION: ${{ needs.validate.outputs.revision }}
          ARCH: ${{ matrix.arch }}
        run: python3 .github/scripts/smoke-image.py
      - name: Scan native wrapper before promotion
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
        with:
          image-ref: ghcr.io/silenthooligan/localsky-haos@${{ steps.build.outputs.digest }}
          format: json
          output: trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Record verified digest and scan architecture
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          assert json.load(open('trivy.json'))['Metadata']['ImageConfig']['architecture'] == os.environ['ARCH']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', os.environ['DIGEST'])
          pathlib.Path('digests').mkdir()
          pathlib.Path('digests', os.environ['ARCH'] + '.json').write_text(json.dumps({'architecture': os.environ['ARCH'], 'digest': os.environ['DIGEST']}))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*.json
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: image-checks-${{ matrix.arch }}
          path: |
            runtime-proof.json
            trivy.json
          overwrite: true
  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote verified images and update app store
        env:
          VERSION: ${{ inputs.version }}
          CHANGELOG: ${{ inputs.changelog }}
        run: python3 .github/scripts/release.py publish
